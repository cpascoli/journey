# Journey website: Netlify builds the Next.js app in web/.

[build]
  base = "web"
  command = "pnpm install --frozen-lockfile && pnpm build"
  publish = ".next"
  # Runs from the base directory. Skips deploys for commits that only touch
  # the iOS app or the repo docs.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../netlify.toml"

[build.environment]
  NODE_VERSION = "22"
  # pnpm comes from the packageManager field in web/package.json.

# Named explicitly because Netlify detected Next.js here but didn't install its
# runtime on its own: the first deploy served the raw .next folder as static
# files and every route 404ed. The version is pinned in web/package.json.
[[plugins]]
  package = "@netlify/plugin-nextjs"

[dev]
  command = "pnpm dev"
  targetPort = 3000
  port = 8888
  autoLaunch = false

[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# Set in the Netlify UI for the site, scoped to Builds and Functions, and
# never as NEXT_PUBLIC_*:
#   SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY
#   JOURNEY_API_KEYS   JSON array of API keys (see web/README.md)
#   JOURNEY_SESSION_SECRET   independent random value, at least 32 characters
