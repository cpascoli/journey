# Journey website: Netlify builds the Next.js app in web/.

[build]
  base = "web"
  command = "pnpm install --frozen-lockfile && pnpm build"
  publish = ".next"
  # Runs from the base directory. Skips deploys for commits that only touch
  # the iOS app or the repo docs.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../netlify.toml"

[build.environment]
  NODE_VERSION = "22"
  # pnpm comes from the packageManager field in web/package.json.

# Named explicitly because Netlify detected Next.js here but didn't install its
# runtime on its own: the first deploy served the raw .next folder as static
# files and every route 404ed. The version is pinned in web/package.json.
[[plugins]]
  package = "@netlify/plugin-nextjs"

[dev]
  command = "pnpm dev"
  targetPort = 3000
  port = 8888
  autoLaunch = false

# The site is ashone.me. The .netlify.app subdomain keeps serving otherwise,
# which would leave the journal live at two hostnames and strand invite links
# already shared: an invite cookie is set per host, so a reader arriving on
# the old name would be reading from a different origin. A 301 keeps the path,
# so an existing https://journey-web.netlify.app/i/<token> link still works
# and lands on the real domain.
[[redirects]]
  from = "https://journey-web.netlify.app/*"
  to = "https://ashone.me/:splat"
  status = 301
  force = true

# Security headers live in web/next.config.ts, not here: a [[headers]] block
# does not reach responses served by the Next.js runtime, which is every route
# on this site, so headers set here are silently absent in production.

# Set in the Netlify UI for the site, scoped to Builds and Functions, and
# never as NEXT_PUBLIC_*:
#   SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY
#   JOURNEY_API_KEYS   JSON array of API keys (see web/README.md)
#   JOURNEY_SESSION_SECRET   independent random value, at least 32 characters
