name: Journey
options:
  bundleIdPrefix: com.carlopascoli
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.2"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 7DZ8FR94Q3
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

targets:
  Journey:
    type: application
    platform: iOS
    sources:
      - path: Journey
        type: syncedFolder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.carlopascoli.journey
        # Set per target: XcodeGen's iOS preset would otherwise add iPad ("1,2").
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        STRING_CATALOG_GENERATE_SYMBOLS: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Journey
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Journey records the places you visit so they can be added to your journal.
        INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: Journey records the places you visit in the background so your days can be journaled automatically.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Journey shows the photos and videos you took at each place you visited.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Journey uses the microphone so you can dictate journal entries.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Journey transcribes your dictated journal entries.

  JourneyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: JourneyUITests
        type: syncedFolder
    dependencies:
      - target: Journey
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.carlopascoli.journey.uitests
        TARGETED_DEVICE_FAMILY: "1"
        TEST_TARGET_NAME: Journey
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Journey:
    build:
      targets:
        Journey: all
        JourneyUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        # DemoWalkthrough is a recording script, not a test.
        - name: JourneyUITests
          skippedTests:
            - DemoWalkthrough

  # Used only by Tools/record-demo.sh to capture the README walkthrough.
  Journey-Demo:
    build:
      targets:
        Journey: all
        JourneyUITests: [test]
    run:
      config: Debug
      commandLineArguments:
        "-demo": true
    test:
      config: Debug
      targets:
        - JourneyUITests
